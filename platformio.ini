[platformio]
default_envs = esp32s3-n16r8

[env:esp32s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/generate_protocol_vectors_header.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DTOUCH_CS=-1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=11
  -DTFT_MISO=13
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=14
  -DTFT_BL=47
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=10000000
  -DSPI_READ_FREQUENCY=4000000
  -DSPI_TOUCH_FREQUENCY=2500000
